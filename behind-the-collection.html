<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Behind the Collection — Leia</title>
  <meta name="description" content="Behind the Collection: the full research and design process for a tool that creates bespoke protective foam inserts for museum and archive objects.">
  <meta name="theme-color" content="#fff8e7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400,0,1;9..144,600,0,1;9..144,700,0,1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007173407">
</head>
<body>
  <div class="project-page project-page--wide">
    <header class="project-header">
      <a class="back-link" href="index.html#open=behind-the-collection"><span aria-hidden="true">←</span> Project overview</a>
      <h1 class="panel-title">Behind the Collection</h1>
    </header>

    <main class="process-slides">
      <section class="process-slide" id="team" aria-label="Meet the Team">
        <img src="assets/projects/behind-the-collection/slide-01.webp" width="1684" height="1190" alt="Meet the team: Ikem Enebeli (CIO, research data and outreach), Leia Whitaker (CTO, technical development), Tim Spawforth (CCO, communications and branding) and Will Purcell (COO, operations and planning)." decoding="async">
      </section>
      <section class="process-slide" id="archives-collections" aria-label="Archives &amp; Collections Management">
        <img src="assets/projects/behind-the-collection/slide-02.webp" width="1684" height="1190" alt="Archives and collections management in GLAM organisations: what it is, why it matters, the core workflow from acquisition to access, the stakeholders involved, and the fact that 91% of Historic Environment Records have a backlog." decoding="async">
      </section>
      <section class="process-slide" id="user-focus" aria-label="Operationalisation &amp; User Focus">
        <img src="assets/projects/behind-the-collection/slide-03.webp" width="1684" height="1190" alt="Operationalisation and user focus: interviews and snowball sampling, knowledge thresholds, observations, data synthesis, affinity diagrams and user personas, with a focus on archivists, collection managers, specialists and volunteers." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="interviews" aria-label="Interviews &amp; Observations">
        <img src="assets/projects/behind-the-collection/slide-04.webp" width="1684" height="1190" alt="Interviews and observations: initial key findings, desk research, snowball sampling with organisations such as the V&amp;A, Natural History Museum and UCL Institute of Archaeology, ethics, and key findings about backlogs, storage and digitisation." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="insights" aria-label="Affinity &amp; Insights">
        <img src="assets/projects/behind-the-collection/slide-05.webp" width="1684" height="1190" alt="Affinity mapping and insights: every relevant piece of data sorted into themes such as staff experience, consumer experience, knowledge barriers, metadata, shapes and sizes and condition monitoring, leading to three How Might We questions." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="journey-mapping" aria-label="Personas &amp; Journey Mapping">
        <img src="assets/projects/behind-the-collection/slide-06.webp" width="1684" height="1190" alt="Personas and journey mapping: Gerald, a member of the public, and Lexi, an archivist, mapped across the collection workflow from pre-ingest to exhibition, with pain points and combined How Might We statements." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="market-analysis" aria-label="Market Analysis">
        <img src="assets/projects/behind-the-collection/slide-07.webp" width="1684" height="1190" alt="Market analysis: combined How Might We statements, gaps in the market, problem areas, an interview with the CEO of The London Archives, and target market and funding alignment across major institutions." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="teardown" aria-label="Teardown: Label Printer">
        <img src="assets/projects/behind-the-collection/slide-08.webp" width="1684" height="1190" alt="Teardown of a handheld label printer, examining its PCB and battery, keypad, casing, NFC coil, gear reduction, heating element, DC motor and screen to inform design for manufacture." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="competing-products" aria-label="Competing Product Analysis">
        <img src="assets/projects/behind-the-collection/slide-09.webp" width="1684" height="1190" alt="Competing product analysis of a 3D scanner, a box-making machine, Shadow Foam and an open-source scanner, with the pros, cons and pain points found by buying and testing them." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="collection-management" aria-label="Collection Management">
        <img src="assets/projects/behind-the-collection/slide-10.webp" width="1684" height="1190" alt="Collection management: knowledge barriers and variable artefact geometries in cataloguing and storage, covering manipulation, locating items, monitoring and mounting." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="calendar" aria-label="Project Calendar">
        <img src="assets/projects/behind-the-collection/slide-11.webp" width="1684" height="1190" alt="Project calendar from January to June showing research, reporting, ideation, prototyping and manufacture milestones for each team member." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="hmw" aria-label="Group and Individual HMW">
        <img src="assets/projects/behind-the-collection/slide-12.webp" width="1684" height="578" alt="Group How Might We: create a standardised process which improves the quality of cataloguing and storage of artefacts for both staff and volunteers while adapting to their varied geometries. Individual How Might We: create a standardised collections management workflow that reduces staff reliance while adapting to different artefact geometries." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="individual-focus" aria-label="Individual Focus">
        <img src="assets/projects/behind-the-collection/slide-13.webp" width="1684" height="1190" alt="Individual focus: breaking down the How Might We into related insights and product opportunities, choosing bespoke packaging within the collections management workflow." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="concept-exploration" aria-label="Concept Exploration">
        <img src="assets/projects/behind-the-collection/slide-14.webp" width="1684" height="1190" alt="Concept exploration: six concepts including a location tracker, a label printer, a photography light box, a tracing pad, a net-cutting machine and a foam-cutting tool." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="concept-selection" aria-label="Concept Selection">
        <img src="assets/projects/behind-the-collection/slide-15.webp" width="1684" height="1190" alt="Concept selection using a Pugh matrix and a user interview with a senior archive professional, leading to the final concept: a tool that traces an object and cuts a bespoke foam insert." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="concept-development" aria-label="Concept Development">
        <img src="assets/projects/behind-the-collection/slide-16.webp" width="1684" height="1190" alt="Concept development: requirements, function development, motion tracking and actuation with NEMA 17 steppers and a gantry, a hot blade cutting element, and battery sizing." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="user-experience" aria-label="User Experience">
        <img src="assets/projects/behind-the-collection/slide-17.webp" width="1684" height="1190" alt="User experience: target users, operating height and reach, how it works in three steps (trace, home, cut), safety features and intuitive use." loading="lazy" decoding="async">
      </section>
      <section class="process-slide" id="final-concept" aria-label="Final Concept">
        <img src="assets/projects/behind-the-collection/slide-18.webp" width="1684" height="1190" alt="Final concept: manufacturing and design for assembly using standard components such as aluminium extrusions, NEMA 17 motors and a nichrome cutting rod, with a mass estimate validating the transmission." loading="lazy" decoding="async">
      </section>
    </main>

  </div>

  <a class="back-to-start" href="#team"><span aria-hidden="true">↑</span> Back to the start</a>
  <script>
    // Show "Back to the start" once you've scrolled past the first slide
    const backBtn = document.querySelector('.back-to-start');
    const firstSlide = document.querySelector('.process-slide');
    new IntersectionObserver(([e]) => {
      backBtn.classList.toggle('is-visible', !e.isIntersecting && e.boundingClientRect.top < 0);
    }).observe(firstSlide);
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
      history.replaceState(null, '', location.pathname);
    });
  </script>
</body>
</html>
